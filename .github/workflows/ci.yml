name: SmartStock AI - Continuous Integration & Quality Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Static Application, Compose & Docker Build Validation
  # ----------------------------------------------------------------------------
  validate-and-test:
    name: Validate Config, Docker Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Project Files
        run: |
          echo "Validating static assets and configuration files..."
          test -f index.html || { echo "ERROR: index.html not found!"; exit 1; }
          test -f nginx.conf || { echo "ERROR: nginx.conf not found!"; exit 1; }
          test -f Dockerfile || { echo "ERROR: Dockerfile not found!"; exit 1; }
          test -f compose.yaml || { echo "ERROR: compose.yaml not found!"; exit 1; }
          echo "All required core files are present."

      - name: Validate Docker Compose Configuration
        run: |
          echo "Validating compose.yaml syntax and configuration..."
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          docker build -t smartstock-app:test .

      - name: Validate Nginx Configuration Inside Container
        run: |
          echo "Testing Nginx syntax with nginx -t..."
          docker run --rm smartstock-app:test nginx -t

      - name: Launch Container & Verify Health Check
        run: |
          echo "Launching test container mapping host port 8080 to container port 80..."
          docker run -d --name test-smartstock -p 8080:80 smartstock-app:test

          echo "Waiting for container health check on http://localhost:8080/healthz..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/healthz || echo "failed")
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED with HTTP 200 OK!"
              curl -s http://localhost:8080/healthz
              break
            fi
            echo "Attempt $i: status is $STATUS, retrying in 2 seconds..."
            sleep 2
          done

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Health check failed! Container logs:"
            docker logs test-smartstock
            exit 1
          fi

          echo "Verifying root route http://localhost:8080/..."
          ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || echo "failed")
          if [ "$ROOT_STATUS" != "200" ]; then
            echo "ERROR: Root URL returned status $ROOT_STATUS"
            docker logs test-smartstock
            exit 1
          fi
          echo "Root route PASSED with HTTP 200 OK!"

      - name: Cleanup Test Container
        if: always()
        run: |
          docker stop test-smartstock || true
          docker rm test-smartstock || true

  # ----------------------------------------------------------------------------
  # Stage 2: Security & Vulnerability Scan (Trivy)
  # ----------------------------------------------------------------------------
  security-vulnerability-scan:
    name: Trivy Security Scan
    needs: [validate-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Image for Security Scan
        run: docker build -t smartstock-app:scan .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smartstock-app:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # Stage 3: Publish Image to Registry (Main Branch Only, Never on Pull Requests)
  # ----------------------------------------------------------------------------
  publish-container-image:
    name: Publish Production Image to Registry
    needs: [security-vulnerability-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional Docker Hub Login
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
