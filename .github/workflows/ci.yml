name: SmartStock AI - Continuous Integration & Quality Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Automated Linting & Unit Testing
  # ----------------------------------------------------------------------------
  code-quality-and-tests:
    name: Code Quality, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Run Static Analysis & Linter
        run: npm run lint

      - name: Run Automated Business Logic Tests
        run: npm test

  # ----------------------------------------------------------------------------
  # Stage 2: Docker Build & Container Health Validation
  # ----------------------------------------------------------------------------
  docker-build-and-healthcheck:
    name: Docker Build & Health Check
    needs: [code-quality-and-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        run: |
          docker build -t smartstock-app:test .

      - name: Launch Container & Verify Health Check
        run: |
          docker run -d --name test-smartstock -p 8080:8080 smartstock-app:test
          
          # Poll health endpoint with timeout
          echo "Waiting for container health check on http://localhost:8080/healthz..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/healthz || echo "failed")
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED with HTTP 200 OK!"
              curl -s http://localhost:8080/healthz
              break
            fi
            echo "Attempt $i: status is $STATUS, retrying in 2 seconds..."
            sleep 2
          done

          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED!"
            docker logs test-smartstock
            exit 1
          fi

      - name: Cleanup Test Container
        if: always()
        run: |
          docker stop test-smartstock || true
          docker rm test-smartstock || true

  # ----------------------------------------------------------------------------
  # Stage 3: Vulnerability Scanning (Trivy)
  # ----------------------------------------------------------------------------
  security-vulnerability-scan:
    name: Trivy Security & Vulnerability Scan
    needs: [docker-build-and-healthcheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Image for Scanning
        run: docker build -t smartstock-app:scan .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smartstock-app:scan'
          format: 'table'
          exit-code: '0' # Non-blocking on informational, logs report
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # Stage 4: Publish to Container Registry (Main Branch Only)
  # ----------------------------------------------------------------------------
  publish-container-image:
    name: Publish Production Image to Registry
    needs: [security-vulnerability-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional Docker Hub Login
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
